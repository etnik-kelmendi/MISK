<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MISK Product Demo</title>
<meta name="description" content="Interactive, guided demo of MISK: book trusted craftsmen and gardeners, or subscribe to recurring home and garden care.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0B7A55; --brand-2:#12A473; --brand-soft:#E4F4EC; --brand-ink:#063D2B;
  --accent:#FFB020; --accent-soft:#FFF4DC;
  --ink:#0F1A15; --ink-2:#2A3A33; --muted:#62736B; --faint:#94A39C;
  --bg:#EEF3F0; --card:#FFFFFF; --line:#E1E9E4; --line-2:#EEF3F0;
  --danger:#D64545; --info:#2F6FEB; --info-soft:#E8F0FF;
  --pro:#16211C; --pro-2:#22302A;
  --radius:16px; --shadow:0 1px 2px rgba(15,26,21,.06),0 8px 24px rgba(15,26,21,.08);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.125em}

/* ---------- Top bar ---------- */
.topbar{height:60px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;font-size:18px}
.logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:grid;place-items:center;color:#fff;font-size:17px}
.tag{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:4px 10px;border-radius:99px}
.progress{flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:600}
.progress-track{flex:1;height:6px;background:var(--line-2);border-radius:9px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));border-radius:9px;transition:width .4s ease}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 60px)}
.guide{background:var(--card);border-right:1px solid var(--line);padding:28px 28px 24px;display:flex;flex-direction:column;gap:18px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.chapter{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:99px;align-self:flex-start}
.ch-customer{background:var(--brand-soft);color:var(--brand)}
.ch-sub{background:var(--accent-soft);color:#9A6200}
.ch-pro{background:#E9ECEB;color:var(--pro)}
.ch-admin{background:var(--info-soft);color:var(--info)}
.ch-intro{background:var(--line-2);color:var(--ink-2)}
.step-count{font-size:13px;color:var(--muted);font-weight:600}
.guide h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.01em}
.guide p.lead{margin:0;color:var(--ink-2);font-size:15.5px}
.tryit{background:var(--bg);border-radius:14px;padding:14px 16px}
.tryit h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tryit ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.tryit li{display:flex;gap:8px;font-size:14px}
.tryit li svg{color:var(--brand);margin-top:3px}
.why{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:14px;color:var(--ink-2)}
.why b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9A6200;margin-bottom:2px}
.nav-btns{display:flex;gap:10px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .08s ease,background .2s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:#fff;flex:1;box-shadow:0 4px 14px rgba(11,122,85,.25)}
.btn-primary:hover{background:#09694A}
.btn-ghost{background:var(--bg);color:var(--ink-2)}
.btn-ghost:hover{background:var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.kbd{font-size:12px;color:var(--faint);text-align:center}
.steps-nav{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.steps-nav summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);list-style:none;display:flex;justify-content:space-between;align-items:center}
.steps-nav summary::-webkit-details-marker{display:none}
.steps-nav ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.steps-nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;margin:10px 0 4px 8px}
.steps-nav button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;font-size:13.5px;color:var(--ink-2)}
.steps-nav button:hover{background:var(--bg)}
.steps-nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.steps-nav .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--line-2);color:var(--muted);flex:none}
.steps-nav button.done .dot{background:var(--brand);color:#fff}
.steps-nav button.on .dot{background:var(--brand);color:#fff}

.stage{display:flex;align-items:center;justify-content:center;padding:32px 24px;position:relative;overflow:hidden;
  background:radial-gradient(1200px 600px at 70% 0%,rgba(18,164,115,.10),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(255,176,32,.10),transparent 60%),var(--bg)}
.stage-inner{width:100%;display:flex;justify-content:center;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Phone ---------- */
.phone{width:375px;height:760px;max-height:calc(100vh - 124px);min-height:600px;background:#0D1411;border-radius:48px;padding:12px;box-shadow:0 30px 80px rgba(15,26,21,.25),0 0 0 2px #2A3631 inset;position:relative;flex:none}
.phone .screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:#F7FAF8;position:relative;display:flex;flex-direction:column}
.phone .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#0D1411;border-radius:0 0 18px 18px;z-index:5}
.sbar{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:700}
.sbar .sig{display:flex;gap:5px;align-items:center}
.sbar .bat{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.sbar .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none}
.appbar h2{font-size:18px;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:18px}
.body{flex:1;overflow-y:auto;padding:4px 16px 16px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.cta-bar{flex:none;padding:12px 16px 22px;background:linear-gradient(180deg,rgba(247,250,248,0),#F7FAF8 30%)}
.cta{width:100%;height:52px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(11,122,85,.3);transition:background .2s,opacity .2s}
.cta:hover{background:#09694A}
.cta[disabled]{opacity:.4;pointer-events:none;box-shadow:none}
.cta.dark{background:var(--pro);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.tabbar{flex:none;display:flex;justify-content:space-around;padding:8px 8px 20px;background:#fff;border-top:1px solid var(--line)}
.tabbar span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--faint);font-weight:600}
.tabbar span svg{font-size:21px}
.tabbar span.on{color:var(--brand)}

/* in-app components */
.h-sm{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:18px 0 8px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,26,21,.05),0 2px 10px rgba(15,26,21,.05);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.b{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:13px;font-weight:600}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;color:var(--faint);box-shadow:0 1px 3px rgba(0,0,0,.05);font-size:14px;margin-top:12px}
.promo{margin-top:14px;border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,#0B7A55,#12A473 60%,#4CC38A);position:relative;overflow:hidden;cursor:pointer;text-align:left;width:100%}
.promo::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.promo .t{font-weight:800;font-size:17px;line-height:1.25;max-width:220px}
.promo .s{font-size:12.5px;opacity:.9;margin-top:4px;max-width:230px}
.promo .go{margin-top:10px;display:inline-flex;gap:6px;align-items:center;background:#fff;color:var(--brand);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:#fff;border-radius:16px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .15s,box-shadow .15s}
.cat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.cat .ci{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px}
.cat.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,164,115,.45)}60%{box-shadow:0 0 0 10px rgba(18,164,115,0)}}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.procard{min-width:150px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.stars{color:var(--accent);display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12.5px}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:2px 7px;border-radius:99px}
.seg{display:flex;background:#E7EEEA;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.dark{background:#2B3933}
.seg.dark button{color:#9FB0A8}
.seg.dark button.on{background:#fff;color:var(--ink)}
.svc{width:100%;text-align:left;background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:10px;transition:border-color .2s}
.svc.on{border-color:var(--brand);background:#FBFEFC}
.svc .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.svc.on .radio{border-color:var(--brand)}
.svc.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.price{font-weight:800;font-size:15px;white-space:nowrap}
.field{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.field label{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.field input,.field textarea{border:0;outline:0;width:100%;background:transparent;font-size:14.5px;padding:2px 0;resize:none}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.size{background:#fff;border-radius:14px;padding:10px 8px;text-align:center;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.size.on{border-color:var(--brand);background:#FBFEFC}
.size .n{font-weight:700;font-size:13.5px}
.size .d{font-size:11px;color:var(--muted)}
.photos{display:flex;gap:8px}
.ph{width:72px;height:72px;border-radius:12px;flex:none;overflow:hidden;position:relative}
.ph.add{border:2px dashed #C9D6CF;display:grid;place-items:center;color:var(--muted);font-size:22px;background:#fff}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{min-width:56px;background:#fff;border-radius:14px;padding:8px 4px;text-align:center;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.day .dn{font-size:11.5px;color:var(--muted);font-weight:600}
.day .dd{font-size:18px;font-weight:800}
.day.on{background:var(--brand);color:#fff}
.day.on .dn{color:rgba(255,255,255,.8)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:#fff;border-radius:12px;padding:11px 4px;text-align:center;font-weight:700;font-size:14px;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.slot small{display:block;font-size:10.5px;font-weight:600;color:var(--brand)}
.slot.off{opacity:.45;pointer-events:none;text-decoration:line-through}
.slot.off small{color:var(--muted);text-decoration:none}
.slot.on{border-color:var(--brand);background:var(--brand-soft)}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);color:var(--brand-ink);border-radius:14px;padding:12px;font-size:13px}
.info svg{font-size:18px;color:var(--brand);margin-top:1px}
.info.amber{background:var(--accent-soft);color:#6B4500}
.info.amber svg{color:#B87A00}
.line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.line.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-weight:800;font-size:16px}
.paym{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:14px;margin-bottom:8px;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.paym.on{border-color:var(--brand)}
.paym .logo-b{width:38px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.map{height:200px;border-radius:18px;overflow:hidden;position:relative;background:#E3ECE6}
.map svg{width:100%;height:100%;display:block}
.tl{position:relative;padding-left:26px}
.tl-item{position:relative;padding:0 0 16px}
.tl-item::before{content:"";position:absolute;left:-19px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-item .tdot{position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl-item.done .tdot{background:var(--brand);border-color:var(--brand)}
.tl-item.done::before{background:var(--brand)}
.tl-item.now .tdot{border-color:var(--brand);box-shadow:0 0 0 5px rgba(18,164,115,.18)}
.tl-item .tt{font-weight:700;font-size:14px}
.tl-item:not(.done):not(.now) .tt{color:var(--faint)}
.bigstars{display:flex;gap:8px;justify-content:center;font-size:38px;color:#D5DED9}
.bigstars button{transition:transform .15s}
.bigstars button:hover{transform:scale(1.12)}
.bigstars button.on{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:#fff;font-size:13px;font-weight:600;border:1.5px solid var(--line);transition:all .15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.dark.on{background:var(--pro);border-color:var(--pro)}
.plancards{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 6px;scrollbar-width:none}
.plancards::-webkit-scrollbar{display:none}
.plancard{min-width:150px;max-width:150px;text-align:left;background:#fff;border-radius:16px;padding:12px;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.plancard.on{border-color:var(--brand);background:#FBFEFC}
.plancard .pi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;margin-bottom:8px}
.addon{display:flex;align-items:center;gap:12px;padding:11px 12px;background:#fff;border-radius:14px;margin-bottom:8px;width:100%;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.addon.on .cbox{background:var(--brand);border-color:var(--brand)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk button{height:40px;border-radius:12px;background:#fff;font-weight:700;font-size:12.5px;border:1.5px solid var(--line)}
.wk button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.wk.dark button.on{background:var(--pro);border-color:var(--pro)}
.sumbox{background:var(--ink);color:#fff;border-radius:18px;padding:16px}
.sumbox .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.sumbox .sub{color:#A9BDB4;font-size:12.5px}
.visit{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:opacity .2s}
.visit .vd{width:46px;text-align:center;flex:none}
.visit .vd .m{font-size:10.5px;font-weight:700;color:var(--brand);text-transform:uppercase}
.visit .vd .d{font-size:19px;font-weight:800;line-height:1}
.visit.skipped{opacity:.5}
.visit.skipped .vt{text-decoration:line-through}
.mini-btn{padding:6px 11px;border-radius:9px;font-size:12px;font-weight:700;background:var(--bg);color:var(--ink-2)}
.mini-btn.green{background:var(--brand-soft);color:var(--brand)}
.toggle{width:46px;height:28px;border-radius:99px;background:#CDD8D2;position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--brand)}
.toggle.on::after{transform:translateX(18px)}
.doc{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.doc .di{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:18px;color:var(--muted)}
.doc.ok .di{background:var(--brand-soft);color:var(--brand)}
input[type=range]{width:100%;accent-color:var(--pro)}

/* provider theme */
.app.pro{background:#F3F5F4}
.prohead{background:var(--pro);color:#fff;padding:6px 16px 16px;flex:none}
.prohead .row h2{font-size:18px;margin:0;flex:1}
.online{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.online .lamp{width:8px;height:8px;border-radius:50%;background:#3BDB8F;box-shadow:0 0 0 4px rgba(59,219,143,.2)}
.req{border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);animation:slidein .5s ease}
@keyframes slidein{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.req-top{background:linear-gradient(135deg,var(--pro),#2E4A3E);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:800}
.earn{font-size:26px;font-weight:800;color:var(--brand)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
.btn2{flex:1;height:48px;border-radius:13px;font-weight:700;font-size:15px}
.btn2.no{background:var(--bg);color:var(--ink-2)}
.btn2.yes{background:var(--brand);color:#fff}
.flow{display:flex;gap:6px}
.flow div{flex:1;height:5px;border-radius:9px;background:var(--line)}
.flow div.on{background:var(--brand)}
.job{display:flex;gap:12px;padding:12px;background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid var(--brand)}
.job.rec{border-left-color:var(--accent)}
.job .jt{width:48px;flex:none;font-weight:800;font-size:13.5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:#8A5800}
.badge.g{background:var(--brand-soft);color:var(--brand)}
.badge.b{background:var(--info-soft);color:var(--info)}
.badge.r{background:#FDECEC;color:var(--danger)}
.badge.grey{background:var(--line-2);color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.bars .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bar{width:100%;border-radius:7px 7px 3px 3px;background:#CFE9DC;transition:height .6s ease}
.bars .bar.hl{background:var(--brand)}
.bars .bl{font-size:10.5px;color:var(--muted);font-weight:600}

/* chat */
.msg{max-width:80%;background:#fff;border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);align-self:flex-start;position:relative}
.msg.me{background:var(--brand);color:#fff;border-radius:16px 16px 4px 16px;align-self:flex-end}
.msg .mt{display:block;font-size:10.5px;opacity:.6;margin-top:3px;text-align:right}
.msg-ph{margin:-3px -6px 8px;border-radius:12px;overflow:hidden;height:120px}
.msg-ph svg{display:block;width:100%;height:120px}
.msg-sys{align-self:center;font-size:12px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);padding:6px 12px;border-radius:99px;text-align:center}
.xcard{background:#fff;border-radius:16px;padding:14px;border:2px solid var(--accent);box-shadow:0 6px 18px rgba(255,176,32,.18);animation:slidein .5s ease}
@media (max-width:820px){.admin-who{display:none}}
/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:30;white-space:nowrap;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{color:#5BE0A0}

/* ---------- Browser (admin) ---------- */
.browser{width:100%;max-width:1080px;height:calc(100vh - 124px);min-height:600px;max-height:780px;background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(15,26,21,.18);overflow:hidden;display:flex;flex-direction:column;position:relative}
.bchrome{height:44px;flex:none;background:#F1F4F2;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px}
.bdots{display:flex;gap:7px}
.bdots i{width:12px;height:12px;border-radius:50%;background:#E25C5C;display:block}
.bdots i:nth-child(2){background:#E8B33C}
.bdots i:nth-child(3){background:#55C26B}
.burl{flex:1;max-width:460px;margin:0 auto;height:28px;border-radius:8px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;color:var(--muted);border:1px solid var(--line)}
.admin{flex:1;display:grid;grid-template-columns:210px 1fr;min-height:0}
.aside{background:#FAFCFB;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.aside .logo{font-size:15px;padding:4px 8px 16px}
.aside .logo-mark{width:28px;height:28px;font-size:14px;border-radius:8px}
.aside a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;text-decoration:none}
.aside a:hover{background:var(--bg)}
.aside a.on{background:var(--brand-soft);color:var(--brand)}
.aside a svg{font-size:17px}
.aside .cnt{margin-left:auto;font-size:11px;background:var(--danger);color:#fff;border-radius:99px;padding:1px 7px}
.amain{overflow-y:auto;padding:22px 26px 30px}
.amain h3{margin:0;font-size:21px;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .kv2{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.kpi .kd{font-size:12px;font-weight:700;color:var(--brand)}
.agrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
.panel{border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h4{margin:0 0 12px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
table.t{width:100%;min-width:600px;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr.hl td{background:#F5FBF8}
.abtn{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700;background:var(--brand);color:#fff}
.abtn.ghost{background:var(--bg);color:var(--ink-2)}
.abtn.big{padding:11px 18px;font-size:14px}
.builder{display:grid;grid-template-columns:1fr 300px;gap:18px;margin-top:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.af{display:flex;flex-direction:column;gap:6px}
.af.full{grid-column:1/-1}
.af label{font-size:12px;font-weight:700;color:var(--ink-2)}
.af input[type=text],.af input[type=number],.af select{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;outline:0;font-size:14px}
.af input:focus,.af select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,164,115,.15)}
.af .hint{font-size:11.5px;color:var(--muted)}
.taskchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.taskchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:var(--brand-soft);color:var(--brand-ink);font-size:12.5px;font-weight:600}
.taskchip button{opacity:.6;font-size:13px}
.preview{background:var(--bg);border-radius:16px;padding:16px;position:sticky;top:0;align-self:start}
.preview .pv-l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:10px}
.split{display:flex;height:10px;border-radius:9px;overflow:hidden;margin:8px 0 6px}
.split div:first-child{background:var(--brand)}
.split div:last-child{background:var(--accent)}

/* ---------- Welcome / finish ---------- */
.hero{max-width:880px;width:100%;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:44px;display:grid;gap:26px}
.hero h2{font-size:40px;line-height:1.08;margin:0;letter-spacing:-.025em}
.hero h2 em{font-style:normal;color:var(--brand)}
.hero p{margin:0;font-size:17px;color:var(--ink-2);max-width:640px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.role{border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:8px}
.role .ri{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px}
.role h5{margin:0;font-size:16px}
.role p{font-size:13.5px;color:var(--muted)}
.role .st{font-size:12px;font-weight:700;color:var(--faint)}
.hero .btn-primary{flex:none;height:52px;padding:0 26px;font-size:16px}
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ph-card{border-radius:16px;padding:16px;border:1px solid var(--line);position:relative;overflow:hidden}
.ph-card .wk2{font-size:12px;font-weight:700;color:var(--muted)}
.ph-card h5{margin:6px 0 8px;font-size:15.5px}
.ph-card ul{margin:0;padding-left:16px;font-size:13px;color:var(--ink-2);display:grid;gap:3px}
.ph-card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px}
.ph1::before{background:var(--brand)} .ph2::before{background:var(--accent)} .ph3::before{background:var(--pro)} .ph4::before{background:var(--info)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .layout{grid-template-columns:340px 1fr}
  .guide{padding:22px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .agrid,.builder{grid-template-columns:1fr}
  .admin{grid-template-columns:64px 1fr}
  .aside .logo span,.aside a span,.aside .cnt{display:none}
  .aside a{justify-content:center}
}
@media (max-width:820px){
  .topbar{padding:0 16px;gap:10px}
  .topbar .tag{display:none}
  .layout{grid-template-columns:1fr}
  .guide{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 16px;gap:12px}
  .guide h1{font-size:21px}
  .guide .tryit,.guide .why,.guide .kbd{display:none}
  .guide.expanded .tryit,.guide.expanded .why{display:block}
  .more-btn{display:inline-flex!important}
  .stage{padding:20px 16px 28px}
  .phone{width:min(100%,375px);height:700px;max-height:none;border-radius:42px;padding:10px}
  .phone .screen{border-radius:33px}
  .browser{height:720px;max-height:none}
  .admin{grid-template-columns:1fr}
  .aside{display:none}
  .amain{padding:16px}
  .fgrid{grid-template-columns:1fr}
  .hero{padding:24px 20px;gap:20px;border-radius:20px}
  .hero h2{font-size:28px}
  .hero p{font-size:15px}
  .roles,.road{grid-template-columns:1fr}
  .burl{display:none}
}
.more-btn{display:none;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--brand)}
@media (max-width:480px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .kv2{font-size:20px}
  .progress span.lbl{display:none}
}
</style>
</head>

function upcomingVisits(){
  const out=[]; const step = S.pfreq<1?14:7;
  const idx = S.pdays.map(d=>(WEEK.indexOf(d)+1)%7);
  for(let i=1;i<=35 && out.length<8;i++){
    const d=addDays(TODAY,i);
    if(idx.includes(d.getDay())){
      if(step===14){ if(out.length===0 || (d-out[out.length-1])/864e5>=14) out.push(d); }
      else out.push(d);
    }
  }
  return out;
}

      <div class="preview"><div class="pv-l">Live preview · customer app</div>
        <div class="card"><div class="row"><div class="ci" style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:${(CATS.find(c=>c.name===b.cat)||CATS[0]).bg};color:${(CATS.find(c=>c.name===b.cat)||CATS[0]).fg};font-size:19px">${ic((CATS.find(c=>c.name===b.cat)||CATS[0]).icon)}</div><div style="flex:1"><div class="b">${esc(b.name||"Untitled plan")}</div><div class="small muted">${fm[b.freq]} · ${b.dur} min</div></div></div>
          <div style="font-size:28px;font-weight:800;margin-top:12px;letter-spacing:-.02em">${eur(+b.price||0)}<span class="small muted" style="font-weight:600">/month</span></div>
          <div class="small muted">≈ ${eur(Math.round((b.price/vpm)*100)/100)} per visit</div>
          <div style="margin-top:10px;display:grid;gap:4px">${b.tasks.map(t=>`<div class="row small" style="gap:6px"><span style="color:var(--brand)">${ic("check")}</span>${esc(t)}</div>`).join("")}</div>
          ${b.addonName?`<div class="addon" style="margin:10px 0 0;box-shadow:none;border:1px solid var(--line);padding:9px 10px"><span class="cbox" style="width:18px;height:18px"></span><span class="small" style="flex:1">${esc(b.addonName)}</span><b class="small">+${eur(+b.addonPrice||0)}</b></div>`:""}
          <div class="tiny muted" style="margin-top:10px">${b.season?`Season ${b.sFrom} – ${b.sTo} · `:""}${b.skips} skips/month · min. ${b.minTerm} months</div>
          <button class="cta" style="height:42px;font-size:14px;margin-top:12px">Subscribe</button>
        </div>
        <div class="small muted" style="margin-top:12px">${b.published?`<span class="badge g">${ic("check")} Live</span> Customers in the pilot city can subscribe now.`:"Changes appear in the apps the moment you publish."}</div>
      </div>
    </div>`;
  return browser("admin.misk.app/plans/new",main,"Plans");
}

function sFinish(){
  return `<div class="hero">
    <div class="chapter ch-customer">${ic("check")} Tour complete</div>
    <h2>One platform, <em>three happy sides.</em></h2>
    <p>You've seen a customer book and pay for a job, subscribe to weekly care, a pro accept and complete the work, and the MISK team approve pros and launch a new plan, all connected.</p>
    <div class="road">
      <div class="ph-card ph1"><div class="wk2">Phase 1 · weeks 1–10</div><h5>Launch in one city</h5><ul><li>Website for customers & pros</li><li>One-off bookings, 3–5 trades</li><li>Secure payments & payouts</li><li>Admin panel</li></ul></div>
      <div class="ph-card ph2"><div class="wk2">Phase 2 · weeks 11–16</div><h5>Monthly plans</h5><ul><li>Plan builder</li><li>Automatic visit planning</li><li>Skip, pause, change days</li><li>2–3 launch plans</li></ul></div>
      <div class="ph-card ph3"><div class="wk2">Phase 3 · weeks 17–22</div><h5>iPhone & Android apps</h5><ul><li>Customer and pro apps</li><li>Push notifications</li><li>Chat with your pro</li><li>Live pro location</li></ul></div>
      <div class="ph-card ph4"><div class="wk2">Phase 4 · week 23+</div><h5>Grow</h5><ul><li>More cities & trades</li><li>Companies with teams</li><li>Promo codes & referrals</li><li>More languages</li></ul></div>
    </div>
    <div class="row" style="gap:12px;flex-wrap:wrap"><button class="btn btn-primary" data-a="restart">${ic("rotate")} Restart the tour</button><button class="btn btn-ghost" data-a="go" data-v="${IDX("plans")}">Play with the plans again</button></div>
  </div>`;
}

/* =========================================================
   Render
   ========================================================= */
const guideEl=document.getElementById("guide"), stageEl=document.getElementById("stage");
let expanded=false;
function renderGuide(){
  const st=STEPS[S.step], ch=CH[st.ch];
  let groups="", last=null;
  STEPS.forEach((s,i)=>{ if(s.ch!==last){groups+=`<li class="grp">${CH[s.ch][0]}</li>`; last=s.ch;}
    groups+=`<li><button class="${i===S.step?"on":""} ${i<S.step||i<=S.maxStep&&i!==S.step?"done":""}" data-a="go" data-v="${i}"><span class="dot">${i<S.step?ic("check"):i+1}</span>${s.nav}</button></li>`});
  guideEl.className="guide"+(expanded?" expanded":"");
  guideEl.innerHTML=`
    <span class="chapter ${ch[1]}">${ic(ch[2])} ${ch[0]}</span>
    <div><div class="step-count">Step ${S.step+1} of ${STEPS.length}</div><h1 style="margin-top:4px">${st.title}</h1></div>
    <p class="lead">${st.lead}</p>
    ${st.try||st.why?`<button class="more-btn" data-a="expand">${expanded?"Hide tips":"What to try"} ${ic(expanded?"chevD":"chevR")}</button>`:""}
    ${st.try?`<div class="tryit"><h4>Try it</h4><ul>${st.try.map(t=>`<li>${ic("arrowR")}<span>${t}</span></li>`).join("")}</ul></div>`:""}
    ${st.why?`<div class="why"><b>Why it matters</b>${st.why}</div>`:""}
    <div class="nav-btns"><button class="btn btn-ghost" data-a="prev" ${S.step===0?"disabled":""}>${ic("chevL")} Back</button><button class="btn btn-primary" data-a="${S.step===STEPS.length-1?"restart":"next"}">${S.step===0?"Start the tour":S.step===STEPS.length-1?"Start over":"Next step"} ${ic(S.step===STEPS.length-1?"rotate":"chevR")}</button></div>
    <div class="kbd">Tip: use the ← and → keys</div>
    <details class="steps-nav" ${window.innerWidth>820?"open":""}><summary>All steps ${ic("chevD")}</summary><ol>${groups}</ol></details>`;
}
function renderStage(keepScroll){
  const st=STEPS[S.step];
  const prevBody=stageEl.querySelector(".body,.amain"); const sc=keepScroll&&prevBody?prevBody.scrollTop:0;
  const html=st.screen();
  if(st.device==="phone") stageEl.innerHTML=`<div class="phone"><div class="notch"></div><div class="screen">${html}<div class="toast" id="toast"></div></div></div>`;
  else stageEl.innerHTML=html;
  if(!keepScroll){stageEl.style.animation="none";void stageEl.offsetWidth;stageEl.style.animation="";}
  const nb=stageEl.querySelector(".body,.amain"); if(nb&&keepScroll) nb.scrollTop=sc;
}
function render(keepScroll=false){
  document.getElementById("progFill").style.width=((S.step)/(STEPS.length-1)*100)+"%";
  document.getElementById("progLbl").textContent=`Step ${S.step+1} of ${STEPS.length}`;
  renderGuide(); renderStage(keepScroll);
}
const refresh=()=>renderStage(true);

function toast(msg){
  const t=document.getElementById("toast"); if(!t) return;
  t.innerHTML=ic("check")+msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}

/* Fill sensible defaults when the client jumps ahead with the guide */
function ensureDefaults(target){
  if(target===IDX("week")) proDay=Math.min(6,S.day+1);
  if(target>IDX("login") && S.auth<2){ S.auth=2; S.otp="4821"; }
  if(target>=IDX("details") && !S.svc) S.svc=cat().services[0].id;
  if(target>=IDX("checkout") && !S.slot){ const i=SLOTS.findIndex((_,k)=>slotFree(S.day,k)); S.slot=SLOTS[i<0?1:i]; }
  if(target>IDX("track") && S.track<3) S.track=3;
  if(target>IDX("chat") && !S.chatDone){ S.track=4; S.chatDone=true; }
  if(target>IDX("plans") && !S.subscribed){ const n=S.pfreq<1?1:S.pfreq; while(S.pdays.length<n){const d=WEEK.find(x=>!S.pdays.includes(x)); S.pdays.push(d);} S.subscribed=true; }
}
function goTo(i){
  i=Math.max(0,Math.min(STEPS.length-1,i));
  clearTimers(); ensureDefaults(i);
  S.step=i; S.maxStep=Math.max(S.maxStep,i);
  render(); window.scrollTo({top:0,behavior:"smooth"});
  onEnter(i);
}
function onEnter(i){
  if(i===IDX("track") && S.track<3){ timers.push(setInterval(()=>{ if(S.step!==IDX("track")) return; S.track=Math.min(3,S.track+1); refresh(); if(S.track>=3) clearTimers(); },2600)); }
  if(i===IDX("login") && S.auth===1) startOtp();
  if(i===IDX("chat")) setTimeout(scrollChat,30);
  if(i===IDX("inbox") && S.inbox==="new"){ timers.push(setInterval(()=>{ if(S.step!==IDX("inbox")||S.inbox!=="new") return; S.countdown=Math.max(0,S.countdown-1); const r=stageEl.querySelector(".ring"); if(r){ const C=2*Math.PI*23; r.querySelectorAll("circle")[1].setAttribute("stroke-dashoffset",C*(1-S.countdown/900)); r.querySelector(".rt").textContent=Math.floor(S.countdown/60)+":"+String(S.countdown%60).padStart(2,"0"); } },1000)); }
}

/* =========================================================
   Events
   ========================================================= */
const ACT = {
  next:()=>goTo(S.step+1), prev:()=>goTo(S.step-1), go:v=>goTo(+v),
  restart:()=>{clearTimers(); S=fresh(); proDay=2; render(); },
  expand:()=>{expanded=!expanded; renderGuide();},
  cat:v=>{ if(S.cat!==v){S.cat=v;S.svc=null;} goTo(IDX("services")); },
  svc:v=>{S.svc=v;refresh()},
  size:v=>{S.size=v;refresh()},
  photo:()=>{S.photos=Math.min(3,S.photos+1);refresh();toast("Photo added")},
  day:v=>{S.day=+v; if(S.slot && !slotFree(S.day,SLOTS.indexOf(S.slot))) S.slot=null; refresh()},
  slot:v=>{S.slot=v;refresh()},
  pay:v=>{S.pay=v;refresh()},
  book:()=>{S.booked=true; S.track=0; toast("Booked! Payment held securely"); setTimeout(()=>goTo(IDX("track")),900)},
  track:()=>{S.track=Math.min(3,S.track+1); refresh(); if(S.track>=3) clearTimers();},
  auth:v=>{S.auth=+v; refresh(); if(S.auth===1) startOtp();},
  role:v=>{S.role=v; refresh();},
  enterapp:()=>{ if(S.role==="pro") goTo(IDX("onboard")); else goTo(IDX("home")); },
  extra:v=>{ if(S.extra!=="pending") return; S.extra=v;
    S.chat.push({from:"me",t:v==="approved"?"Yes please, go ahead!":"No thanks, just the lawn today."});
    if(v==="approved") S.chat.push({from:"sys",t:"You approved +€20 for hedge trimming. It's added to your final payment."});
    refresh(); scrollChat();
    setTimeout(()=>{ S.chat.push({from:"pro",t:v==="approved"?"Great, hedge is done too. All finished! Photos are in the app 🌿":"No problem! All finished, photos are in the app 🌿"}); S.track=4; S.chatDone=true; if(S.step===IDX("chat")){refresh(); scrollChat(); toast("Job complete");} },1600); },
  quick:v=>sendChat(v),
  send:()=>{ const i=document.getElementById("chatIn"); if(i&&i.value.trim()) sendChat(i.value.trim()); },
  rate:v=>{S.rating=+v;refresh()},
  tag:v=>{S.tags=S.tags.includes(v)?S.tags.filter(x=>x!==v):[...S.tags,v];refresh()},
  tip:v=>{S.tip=+v;refresh()},
  review:()=>{S.reviewed=true;refresh()},
  plan:v=>{S.plan=v;S.paddons=[];S.pfreq=plan().freq;S.pdays=S.pdays.slice(0,S.pfreq<1?1:S.pfreq);refresh()},
  pfreq:v=>{S.pfreq=+v; const n=S.pfreq<1?1:S.pfreq; S.pdays=S.pdays.slice(0,n); refresh()},
  psize:v=>{S.psize=v;refresh()},
  addon:v=>{S.paddons=S.paddons.includes(v)?S.paddons.filter(x=>x!==v):[...S.paddons,v];refresh()},
  pday:v=>{const n=S.pfreq<1?1:S.pfreq; if(S.pdays.includes(v)) S.pdays=S.pdays.filter(x=>x!==v); else { S.pdays=[...S.pdays,v]; if(S.pdays.length>n) S.pdays.shift(); } S.pdays.sort((a,b)=>WEEK.indexOf(a)-WEEK.indexOf(b)); refresh()},
  pwin:v=>{S.pwin=v;refresh()},
  subscribe:()=>{S.subscribed=true;refresh();toast("Subscription started")},
  skip:v=>{S.skipped[v]=!S.skipped[v];refresh();if(S.skipped[v])toast("Visit skipped, credited to next bill")},
  pause:()=>{S.paused=!S.paused;refresh();if(S.paused)toast("Plan paused for 3 weeks")},
  ptrade:v=>{const t=S.pro.trades; S.pro.trades=t.includes(v)?t.filter(x=>x!==v):[...t,v]; if(!S.pro.trades.length) S.pro.trades=[v]; refresh()},
  doc:v=>{S.pro.docs[v]=true;refresh();toast("Document uploaded")},
  pwday:v=>{const d=S.pro.days; S.pro.days=d.includes(v)?d.filter(x=>x!==v):[...d,v].sort((a,b)=>WEEK.indexOf(a)-WEEK.indexOf(b)); refresh()},
  submitpro:()=>{S.pro.docs={id:true,cert:true,ins:true}; if(!S.pro.days.length) S.pro.days=["Mon","Tue","Wed","Thu","Fri"]; S.pro.submitted=true; refresh()},
  inbox:v=>{S.inbox=v; if(v==="new"){S.countdown=899; clearTimers(); onEnter(IDX("inbox"));} refresh(); if(v==="accepted") toast("Job added to your schedule")},
  jobstage:()=>{S.jobstage=Math.min(3,S.jobstage+1);refresh(); if(S.jobstage===3) toast("Job complete, customer notified")},
  proday:v=>{proDay=+v;refresh()},
  approve:()=>{S.approved=true;refresh();toast("Daniel approved and notified")},
  publish:()=>{S.b.published=true;refresh();toast("Plan is live in the customer app")},
  season:()=>{S.b.season=!S.b.season;refresh()},
  rmtask:v=>{S.b.tasks.splice(+v,1);refresh()},
  addtask:()=>{const t=S.b.newTask.trim(); if(t){S.b.tasks.push(t);S.b.newTask="";refresh()}}
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el||el.disabled) return;
  if(el.tagName==="INPUT") return;
  const f=ACT[el.dataset.a]; if(f){e.preventDefault(); f(el.dataset.v);}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.bind){S[el.dataset.bind]=el.value;}
  if(el.dataset.a==="radius"){S.pro.radius=+el.value; const lbl=el.closest(".card"); if(lbl){lbl.querySelector("b").textContent=S.pro.radius+" km"; lbl.querySelector(".small.muted:last-child").textContent=`≈ ${Math.round(S.pro.radius*S.pro.radius*0.9)} customers in this area booked last month`;}}
  if(el.dataset.bb){
    const k=el.dataset.bb; let v=el.value;
    if(["price","dur","minTerm","addonPrice","skips","payout"].includes(k)) v=v===""?0:+v;
    S.b[k]=v; S.b.published=false;
    if(k==="payout"){const l=el.closest(".af"); if(l){l.querySelector("label b").textContent=v+"%"; const sp=l.querySelectorAll(".split div"); sp[0].style.width=v+"%"; sp[1].style.width=(100-v)+"%";}}
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.bb && el.dataset.bb!=="newTask") refresh();
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")){
    if(e.key==="Enter" && e.target.id==="chatIn"){e.preventDefault(); ACT.send(); return;}
    if(e.key==="Enter" && e.target.dataset.bb==="newTask"){e.preventDefault(); ACT.addtask(); setTimeout(()=>{const n=document.querySelector('[data-bb="newTask"]'); n&&n.focus()},0);}
    else if(e.key==="Enter" && e.target.dataset.bb){e.target.blur();}
    return;
  }
  if(e.key==="ArrowRight") goTo(S.step+1);
  if(e.key==="ArrowLeft") goTo(S.step-1);
});

document.getElementById("logoMark").innerHTML=ic("leaf");
render();
</script>
</body>
</html>
